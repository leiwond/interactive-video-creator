<html>

<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@6.x/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vuex/2.1.1/vuex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

</head>
<style>
    .preview canvas {
        max-width: 100px;
    }

    .preview-image img {
        max-width: 100px;
    }

    .preview-wrapper.active .preview-image img {
        border: 2px solid #0275ff;
    }

    .preview-wrapper {
        position: relative;
        width: 100px;
        height: 50px;
    }

    .preview-wrapper .preview-image {
        width: 100px;
        height: 55px;
        position: absolute;
        left: 0px;
        top: 0px
    }

    .preview-wrapper .time {
        bottom: -7px;
        background-color: #ffffff82;
        z-index: 10;
        position: absolute;
        width: 40px;
        padding-left: 4px;
    }

    .preview-wrapper .options {
        top: 10px;
        position: absolute;
        z-index: 12;
        left: 30px;
    }

    .preview-wrapper .text-caption {
        top: 0px;
        position: absolute;
        width: 100px;
        background-color: white;
        z-index: 13;
    }

    .thin-button {
        padding: 0 0px !important;
        min-width: 20px !important;
        height: 20px !important;
    }

    .answer .v-text-field__details {
        display: none;
    }

    .question-wrapper {
        position: relative;
        text-align: center;
        background-color: rgba(255, 255, 255, 0.6);
        padding: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .question-wrapper>div>div {
        margin-bottom: 5px;
    }

    .question-wrapper .title {
        margin-bottom: 15px;
        margin-top: 10px;
        padding: 10px 50px;
        font-size: 22px !important;
    }

    .question-preview {
        position: absolute;
        top: 0px;
        left: 0px;
        z-index: 11;
        height: 320px;
        width: 100%;
    }

    button.timeSelected {
        color: #0275ff !important;
        font-size: 15px !important;
    }
</style>
<body>
    <v-app id="app" class="text-3xl">
        <v-app>
            <v-main>
                <v-container>
                    <v-row>
                        <v-col cols="6">
                            <v-row class="mt-2">
                                <v-col cols="12">
                                    <v-row style="z-index: 100;">
                                        <!--<v-text-field label="Video URL" v-model="filepathInput"></v-text-field>-->
                                        <v-combobox
                                        v-model="filepathInput"
                                        label="Combobox"
                                        :items="filepathHistory"
                                        ></v-combobox>
                                        <v-btn v-if="filepath !== filepathInput" @click="loadFilepathInput()">Load</v-btn>
                                    </v-row>
                                    <div style="position: relative; min-height: 320px;">
                                        <div v-if="isYTVideo" id="ytPlayer" style="position:absolute;left:0px;top:0px;height:320px;"></div>
                                        <video v-else ref="video" style="position:absolute;top:0px;left:0px;z-index:10;height:320px;" class="" id="video">
                                            <source :src="filepath" type="video/mp4">
                                            </source>
                                        </video>
                                        
                                        <question-preview v-if="editQuestion !== null && isVideoTimeQuestionTime" :id="`question-preview-${editQuestion.id}`" class="question-preview" :key="editQuestion.id" :question="editQuestion" @choose-answer="(a) => chooseAnswer(a)" />
                                    </div>
                                </v-col>
                                <v-col cols="12">
                                    <input type="range" ref="videoRange" min="0" max="10000" value="0" style="width:100%" />
                                </v-col>
                                <v-col cols="12" v-if="videoCurrentTime > -1">
                                    <div style="position: relative;">
                                        <template v-for="(question,index) in questions">
                                            <!--{{ question }} -->
                                            <div :style="`position:absolute;z-index:10;width: 3px; top:-24px; left:${-2 + parseInt(554 * question.time/getVideoDuration())}px`"><v-btn :class="{primary:(editQuestion && question.id === editQuestion.id)}" class="thin-button" @click="selectQuestion(question)">&#128488</v-btn></div>
                                            <div v-for="(answer,index2) in question.answers.filter((a)=> a.action === 'pick')" :style="`position:absolute;width: 3px; top:-24px; left:${-2 + parseInt(554 * answer.time/getVideoDuration())}px`">
                                                <v-btn v-if="answer.time > -1" plain small :class="{timeSelected:question.id === editQuestion.id}" class="thin-button" @click="selectQuestion(question, answer)">|</v-btn>
                                            </div>
                                        </template>
                                        <!--<div v-if="!isVideoTimeQuestionTime && !seekAnswerVideo && !seekQuestionVideo" :style="`position:absolute;z-index:9;width: 3px; top:-24px; left:${-2 + parseInt(554 * videoCurrentTime/getVideoDuration())}px`">
                                            <v-btn class="thin-button" @click="addQuestion()">+</v-btn>
                                        </div>-->
                                    </div>
                                </v-col>
                                <v-col cols="12">
                                    <v-btn @click="togglePlay()">
                                        <v-icon class="play-pause" v-if="videoPaused">mdi-play</v-icon>
                                        <v-icon class="play-pause" v-else>mdi-pause</v-icon>
                                    </v-btn>
                                    <template v-if="firstPlayed">
                                        <v-btn v-if="!isVideoTimeQuestionTime && !seekAnswerVideo && !seekQuestionVideo" @click="addQuestion()">Add Answer</v-btn>
                                        <v-btn class="warning" v-else @click="deleteQuestion()">Delete Question</v-btn>
                                    </template>
                                </v-col>
                            </v-row>
                        </v-col>
                        <v-col cols="6" v-if="editQuestion !== null && showQuestion" class="pt-12">
                            <v-row>
                                <v-col cols="12" id="question-video-offset" class="video-seek">
                                    <video-seek-preview :class="{active: seekQuestionVideo}" :key="questionKey" :draw-default="true" :time="editQuestion.time" :image="editQuestion.image" :reset="videoSeekReset" @select="$refs.video.currentTime = editQuestion.time" @time="setQuestionTime" />
                                </v-col>
                                <v-col cols="12">
                                    <v-textarea v-model="editQuestion.title" rows="3" filled label="Text"></v-textarea>
                                </v-col>
                            </v-row>
                            <v-row class="answer" v-for="(answer,index) in editQuestion.answers" outlined>
                                <v-col cols="4">
                                    <v-text-field v-model="answer.text" filled :label="`Antwort ${index+1}`"></v-text-field>
                                </v-col>
                                <v-col v-if="answer.text.length > 0" cols="4">
                                    <v-select filled label="Aktion" v-model="answer.action" :items="answerActionItems" @change="changeAnswerAction(answer)"></v-select>
                                </v-col>
                                <v-col v-if="answer.text.length > 0 && answer.action === 'pick'" cols="2">
                                    <div :id="`answer-seek-${answer.id}`" class="video-seek">
                                        <video-seek-preview :draw-default="false" :time="answer.time" :image="answer.image" :reset="videoSeekReset" @select="$refs.video.currentTime = answer.time" @time="setAnswerTime(answer)" />
                                    </div>
                                </v-col>
                                <v-col v-if="answer.text.length > 0 && answer.action === 'goTo'" cols="2">
                                    <v-select filled label="Antwort" v-model="answer.goToId" :items="answerActionTimes" @change="changeAnswerAction(answer)"></v-select>
                                </v-col>
                                <v-col cols="2"><v-btn @click="editQuestion.answers.splice(index, 1);" x-small fab plain><v-icon>mdi-close</v-icon></v-btn></v-col>

                            </v-row>

                            <!--<v-row v-if="editQuestion.title.length > 0">
                                <v-col cols="12"><v-btn @click="addAnswer()">Antwort hinzufügen</button></v-row></v-col>
                            </v-row>-->
                        </v-col>
                    </v-row>
                    <canvas style="display: none;" ref="canvas"></canvas>
                    <v-btn v-if="questions.length > 0" style="position: fixed; bottom: 20px; right: 100px;" x-small @click="resetStorage()">reset</v-btn>
                </v-container>
            </v-main>

        </v-app>
    </div>

    <script type="module" src="main.js">


    </script>
</body>

</html>
